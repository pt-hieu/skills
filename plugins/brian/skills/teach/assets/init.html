<!doctype html>
<!--
  Starter for a teach lesson. Copy this file, then replace every {{PLACEHOLDER}} and every marker comment.
  Keep the libraries, styles, and helpers as they are; write only the lesson's content and illustrations.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" integrity="sha384-XmJ9SoHtVOHoQUcKvFAzVXwdkKo1Ie3bhmSoIAkcdsHGaIrVJIkmozyq0FJeb/Ly" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light;
    --paper: #f3efe3;
    --ink: #1e1c1a;
    --muted: #6d675a;
    --line: #d4cdb9;
    --fill: #e4dcc7;
    --cheek: #e6a9a4;
    /* Concept colours: give each one a single concept for the whole page, and rename them to match.
       Use the fill in drawings and the matching -text colour in prose, where the fill is too pale to read. */
    --concept-1: #8298b5;
    --concept-1-text: #46628a;
    --concept-2: #c9a23c;
    --concept-2-text: #7a5e12;
    --concept-3: #b5646b;
    --concept-3-text: #94434c;
    --concept-4: #a9793f;
    --concept-4-text: #76501f;
    --serif: "Iowan Old Style", Charter, "Bitstream Charter", Georgia, serif;
    --display: "American Typewriter", "Iowan Old Style", Georgia, serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 72rem;
    background: var(--paper);
    color: var(--ink);
    font: 1.1875rem/1.65 var(--serif);
  }

  /* Desktop only: the level map beside a centred column of rows. */
  .layout {
    display: grid;
    grid-template-columns: 11rem minmax(0, 1fr);
    gap: 2.5rem;
    padding: 2.5rem 2.5rem 6rem;
  }

  .map {
    position: sticky;
    top: 4rem;
    align-self: start;
    font: 0.9375rem/1.4 var(--display);
  }
  .map ol { list-style: none; margin: 0; padding: 0; }
  .map li { padding: 0.45rem 0; color: var(--muted); }
  .map a { color: inherit; text-decoration: none; }
  .map a[aria-current] { color: var(--ink); font-weight: 600; }
  .map a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  h1, h2 { font-family: var(--display); }
  h1 {
    font-size: clamp(2.25rem, 6vw, 3.25rem);
    line-height: 1.1;
    font-weight: 400;
    margin: 0 0 1rem;
  }
  .lede { font-size: 1.3125rem; line-height: 1.5; margin: 0; }
  section { margin-bottom: 7rem; scroll-margin-top: 2.5rem; }
  main { width: 100%; max-width: 72rem; margin-inline: auto; }
  section { margin-bottom: 9rem; scroll-margin-top: 2.5rem; }

  /* A level is a stack of rows that pair prose with illustrations, with wide gaps between them. */
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4.5rem;
    align-items: center;
    margin-bottom: 5.5rem;
  }
  .row.wide-left { grid-template-columns: 3fr 2fr; }
  .row.wide-right { grid-template-columns: 2fr 3fr; }
  .spots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3rem;
    margin: 2.5rem 0 5.5rem;
  }
  figcaption { margin-top: 0.75rem; text-align: center; font: 1rem/1.4 var(--display); }
  h2 { font-size: 1.75rem; line-height: 1.2; font-weight: 400; margin: 0 0 1rem; }
  p { margin: 0 0 1.1rem; }
  p:last-child { margin-bottom: 0; }
  .recap { max-width: 44rem; font-size: 1.3125rem; line-height: 1.5; }
  .concept-1 { color: var(--concept-1-text); font-weight: 600; }
  .concept-2 { color: var(--concept-2-text); font-weight: 600; }
  .concept-3 { color: var(--concept-3-text); font-weight: 600; }
  .concept-4 { color: var(--concept-4-text); font-weight: 600; }

  figure { margin: 0; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: var(--display); fill: var(--ink); }

  .progress { display: none; gap: 0.25rem; margin-top: 1rem; }
  .progress span {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--line);
    transition: background-color 0.3s;
  }
  .progress span.done { background: var(--muted); }
  .caption {
    display: none;
    min-height: 3.4em;
    margin-top: 0.75rem;
    font: 1.125rem/1.5 var(--display);
  }
  .steps { margin: 1rem 0 0; padding-left: 1.5rem; font: 1.0625rem/1.5 var(--display); }
  .steps li { margin-bottom: 0.4rem; }

  /* teachScene adds .animated, so the numbered steps stay visible if motion is reduced or a library fails to load. */
  .animated .progress { display: flex; }
  .animated .caption { display: block; }
  .animated .steps {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="map" aria-label="Levels">
    <ol>
      <!-- LEVEL_MAP: <li><a href="#level-1">1. Name</a></li> per level -->
    </ol>
  </nav>

  <main>
    <div class="row">
      <div>
        <h1>{{TITLE}}</h1>
        <p class="lede">{{LEDE}}</p>
      </div>
      <figure id="hero"><svg viewBox="0 0 360 200" role="img" aria-label="{{HERO_DESCRIPTION}}"></svg></figure>
    </div>

    <!-- LEVELS
    One section per level. Pair each passage of prose with an illustration, in rows that vary which side has the art.

    <section id="level-1">
      <h2>Level 1: Name</h2>
      <div class="row">
        <div><p>Why this level, with every new term defined before the animation uses it.</p></div>
        <figure id="l1-why"><svg viewBox="0 0 360 200" role="img" aria-label="What the drawing shows"></svg></figure>
      </div>
      <div class="row wide-left">
        <figure id="scene-1">
          <svg viewBox="0 0 560 200" role="img" aria-label="What the animation shows">
            <g class="layer">
              groups with class="part" for anything that takes focus
              inside each, an empty group for the drawing, then its text, so labels appear on top
            </g>
          </svg>
          <div class="progress" aria-hidden="true"></div>
          <div class="caption" aria-hidden="true"></div>
          <ol class="steps"><li>One caption per step.</li></ol>
        </figure>
        <div><p>Explanation, with a concrete example before any formal term.</p></div>
      </div>
      <p>A sentence introducing a set of examples.</p>
      <div class="spots">
        <figure id="l1-spot-1"><svg viewBox="0 0 200 110" role="img" aria-label="What the drawing shows"></svg><figcaption>Short label</figcaption></figure>
      </div>
      <p class="recap">One or two sentences to take into the next level.</p>
    </section>
    -->
  </main>
</div>

<script>
  /*
    Runs one self-playing, looping scene.

    draw(kit) adds the drawings once. kit holds:
      shape(parent, kind, args, style): a printed shape. kind is a Rough.js shape
        ('rectangle', 'circle', 'ellipse', 'polygon', 'path') and args are its arguments.
        style can set fill, speckle (0 for none), hatch ({ angle, gap }), and stroke ('none' for no outline).
      line(parent, x1, y1, x2, y2, { stroke, width, dash }): an ink line
      person(parent, cx, ground, { reach: [x, y] }): the lesson's recurring character, standing on
        the ground line at cx. reach points their arm at a spot, and the arm has class "arm".
      label(parent, text, x, y, { size, anchor }): typewriter text; call it after the shapes it labels, so it appears on top
      add(parent, node): appends a node to a selector or element
      svg, rc, ROUGH: the figure's SVG, and the Rough.js generator and base options, for anything else

    steps has one entry per <li> in the figure's .steps list:
      focus: selector for the .part groups in focus; the others dim
      hold: seconds on this step, long enough to read its caption
      play(tl, at): adds this step's tweens to the GSAP timeline, starting at time `at`

    Change state in play() with tl.to or tl.fromTo, never gsap.set, so each loop resets itself.
    Selectors in play() search the whole page, so give ids a per-level prefix and scope classes to the figure.
  */
  function teachKit(svg) {
    const rc = rough.svg(svg);
    const ROUGH = { seed: 7, roughness: 0.8, bowing: 0.7, fillStyle: 'solid' };
    const INK = 'var(--ink)';
    const PAPER = 'var(--paper)';
    const toElement = (target) => (typeof target === 'string' ? svg.querySelector(target) : target);
    const group = (parent) => {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      toElement(parent).append(node);
      return node;
    };

    // White flecks where the ink didn't take, drawn as dots so they stay cheap to animate.
    let seed = 11;
    const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    function specks(parent, filled, density) {
      const box = filled.getBBox();
      const point = svg.createSVGPoint();
      const dots = [[], []];
      for (let i = 0, n = box.width * box.height * density; i < n; i++) {
        point.x = box.x + random() * box.width;
        point.y = box.y + random() * box.height;
        if (filled.isPointInFill(point)) dots[random() < 0.8 ? 0 : 1].push(`M${point.x.toFixed(1)} ${point.y.toFixed(1)}h0`);
      }
      dots.forEach((d, i) => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d.join(''));
        path.setAttribute('stroke', PAPER);
        path.setAttribute('stroke-width', i ? 1.25 : 0.7);
        path.setAttribute('stroke-linecap', 'round');
        parent.append(path);
      });
    }

    function shape(parent, kind, args, { fill, speckle = 0.07, hatch, stroke = INK, strokeWidth = 1.5 } = {}) {
      const node = group(parent);
      if (fill) {
        // The fill is printed slightly off its outline, like a print out of register.
        const layer = group(node);
        layer.setAttribute('transform', 'translate(1.4 1.1)');
        const filled = rc[kind](...args, { ...ROUGH, fill, stroke: 'none' });
        layer.append(filled);
        if (speckle) specks(layer, filled.querySelector('path'), speckle);
      }
      if (hatch) {
        node.append(rc[kind](...args, {
          ...ROUGH, fill: INK, fillStyle: 'hachure', stroke: 'none',
          hachureAngle: hatch.angle ?? -55, hachureGap: hatch.gap ?? 4, fillWeight: 0.7,
        }));
      }
      if (stroke !== 'none') node.append(rc[kind](...args, { ...ROUGH, stroke, strokeWidth }));
      return node;
    }

    const line = (parent, x1, y1, x2, y2, { stroke = INK, width = 1.3, dash } = {}) => {
      const node = rc.line(x1, y1, x2, y2, { ...ROUGH, stroke, strokeWidth: width, ...(dash && { strokeLineDash: dash }) });
      toElement(parent).append(node);
      return node;
    };

    function person(parent, cx, ground, { reach, color = 'var(--concept-3)' } = {}) {
      const body = group(parent);
      const head = ground - 84;
      const flat = { speckle: 0 };
      shape(body, 'polygon', [[[cx - 21, ground], [cx - 18, ground - 62], [cx + 18, ground - 62], [cx + 21, ground]]], { fill: PAPER, ...flat });
      shape(body, 'polygon', [[[cx - 16, ground], [cx - 13, ground - 44], [cx + 13, ground - 44], [cx + 16, ground]]], { fill: color });
      line(body, cx - 11, ground - 44, cx - 8, ground - 62);
      line(body, cx + 11, ground - 44, cx + 8, ground - 62);
      shape(body, 'circle', [cx, head, 44], { fill: PAPER, ...flat });
      shape(body, 'ellipse', [cx + 1, head + 10, 10, 6], { fill: 'var(--cheek)', stroke: 'none', ...flat });
      shape(body, 'ellipse', [cx + 17, head + 9, 7, 6], { fill: 'var(--cheek)', stroke: 'none', ...flat });
      shape(body, 'circle', [cx + 9, head + 2, 4], { fill: INK, stroke: 'none', ...flat });
      shape(body, 'path', [`M${cx - 25} ${head - 5}C${cx - 28} ${head - 34} ${cx + 22} ${head - 36} ${cx + 22} ${head - 9}Q${cx} ${head - 2} ${cx - 25} ${head - 5}Z`], { fill: color });
      shape(body, 'ellipse', [cx + 18, head - 7, 40, 8], { fill: INK, ...flat });
      if (reach) {
        const arm = group(body);
        arm.setAttribute('class', 'arm');
        const [x, y] = reach;
        const peg = { disableMultiStroke: true };
        arm.append(rc.line(cx + 14, ground - 56, x, y, { ...ROUGH, ...peg, stroke: INK, strokeWidth: 9 }));
        arm.append(rc.line(cx + 14, ground - 56, x, y, { ...ROUGH, ...peg, stroke: PAPER, strokeWidth: 6.4 }));
        shape(arm, 'circle', [x, y, 11], { fill: PAPER, ...flat });
      }
      return body;
    }

    function label(parent, text, x, y, { size = 14, anchor = 'middle' } = {}) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      Object.entries({ x, y, 'font-size': size, 'text-anchor': anchor }).forEach(([key, value]) => node.setAttribute(key, value));
      node.textContent = text;
      toElement(parent).append(node);
      return node;
    }

    return { svg, rc, ROUGH, shape, line, person, label, add: (parent, node) => toElement(parent).append(node) };
  }

  // Draws one still illustration. draw(kit) uses the same kit as teachScene. If a library fails to load, the SVG is removed and the prose remains.
  function teachDrawing(selector, draw) {
    const svg = document.querySelector(`${selector} svg`);
    if (!window.rough) {
      svg.remove();
      return;
    }
    draw(teachKit(svg));
  }

  function teachScene(selector, { draw, steps }) {
    const figure = document.querySelector(selector);
    const svg = figure.querySelector('svg');
    if (!window.gsap || !window.rough) {
      svg.remove();
      return;
    }

    draw(teachKit(svg));

    const parts = [...svg.querySelectorAll('.part')];
    const lines = [...figure.querySelectorAll('.steps li')].map((li) => li.textContent);
    const caption = figure.querySelector('.caption');
    const progress = figure.querySelector('.progress');
    progress.innerHTML = lines.map(() => '<span></span>').join('');
    const segments = [...progress.children];
    const starts = [];
    let shown = -1;

    function render(step) {
      if (step === shown) return;
      shown = step;
      caption.textContent = lines[step];
      segments.forEach((segment, i) => segment.classList.toggle('done', i <= step));
    }

    const tl = gsap.timeline({
      paused: true,
      repeat: -1,
      onUpdate() {
        const time = tl.time();
        render(Math.max(0, starts.findLastIndex((start) => start <= time)));
      },
    });

    const fade = 0.4;
    const layer = svg.querySelector('.layer');
    tl.fromTo(layer, { opacity: 0 }, { opacity: 1, duration: fade, immediateRender: false }, 0);

    let at = 0;
    steps.forEach((step) => {
      starts.push(at);
      const focused = new Set(svg.querySelectorAll(step.focus));
      tl.to(parts.filter((part) => focused.has(part)), { opacity: 1, duration: 0.5 }, at);
      tl.to(parts.filter((part) => !focused.has(part)), { opacity: 0.38, duration: 0.5 }, at);
      step.play?.(tl, at);
      at += step.hold;
    });
    tl.addLabel('end', at);
    tl.to(layer, { opacity: 0, duration: fade }, at);

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      tl.seek('end');
      gsap.set(parts, { opacity: 1 });
      return;
    }

    figure.classList.add('animated');
    tl.pause(fade);
    render(0);
    new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) tl.restart();
      else tl.pause();
    }, { threshold: 0.5 }).observe(figure);
  }

  // Marks the level being read in the map.
  const mapLinks = new Map([...document.querySelectorAll('.map a')].map((link) => [link.hash.slice(1), link]));
  const levelObserver = new IntersectionObserver((entries) => {
    entries.filter((entry) => entry.isIntersecting).forEach((entry) => {
      mapLinks.forEach((link, id) => {
        if (id === entry.target.id) link.setAttribute('aria-current', 'true');
        else link.removeAttribute('aria-current');
      });
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('main section').forEach((section) => levelObserver.observe(section));

  // SCENES: one teachDrawing or teachScene call per illustration
</script>
</body>
</html>
