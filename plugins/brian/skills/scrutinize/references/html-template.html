<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scrutinize Report</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; max-width: 1080px; margin-left: auto; margin-right: auto; color: #222; background: #fff; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #ddd; }
  .meta { background: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 6px; padding: 12px 16px; font-size: 13px; line-height: 1.6; }
  .meta code { background: #fff; padding: 1px 6px; border-radius: 3px; border: 1px solid #e0e0e0; font-size: 12px; }
  .finding { border: 1px solid #e5e5e5; border-radius: 6px; margin: 10px 0; background: #fff; }
  .finding summary { padding: 10px 14px; cursor: pointer; font-size: 14px; user-select: none; }
  .finding summary::-webkit-details-marker { display: none; }
  .finding summary::before { content: "▸"; display: inline-block; width: 1em; transition: transform 0.15s; }
  .finding[open] summary::before { transform: rotate(90deg); }
  .finding .sev { display: inline-block; font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 3px; color: #fff; margin-right: 8px; }
  .sev-high .sev { background: #b00020; }
  .sev-medium .sev { background: #a06a00; }
  .sev-low .sev { background: #5a5a5a; }
  .finding .dc { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: #555; margin-right: 8px; }
  .finding .file { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: #0050a0; margin-right: 8px; }
  .finding .axes { color: #888; font-size: 12px; margin-right: 8px; }
  .finding .body { padding: 0 16px 14px 30px; font-size: 13px; line-height: 1.55; }
  .finding .body p { margin: 6px 0; }
  .finding pre { background: #f7f7f7; padding: 10px 12px; border-radius: 4px; overflow-x: auto; font-size: 12px; line-height: 1.45; border: 1px solid #eaeaea; }
  .empty { color: #888; font-style: italic; font-size: 13px; }
  .footer { margin-top: 24px; padding: 12px 16px; background: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 6px; font-size: 13px; color: #555; }
</style>
</head>
<body>
<h1>Scrutinize Report</h1>
{{HEADER_META}}

<h2>HIGH</h2>
{{FINDINGS_HIGH}}

<h2>MEDIUM</h2>
{{FINDINGS_MEDIUM}}

<h2>LOW (collapsed themes)</h2>
{{FINDINGS_LOW}}

{{FOOTER_META}}

<script>
  // Click anywhere on the summary toggles; no extra wiring needed beyond <details>.
</script>
</body>
</html>
